<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>운전면허증 종류 안내</title>

<style>
/* 만족도 조사 열기 버튼 */
.survey-guide {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:25px;
  color:#777;
  font-size:24px;
  margin-top:70px;
  margin-bottom:15px;
}

.survey-guide::before,
.survey-guide::after {
  content:"";
  width:180px;
  border-top:2px dashed #ddd;
}

.arrow {
  font-size:30px;
  color:#777;
  margin-bottom:15px;
}

.survey-open {
  width:90%;
  max-width:850px;
  height:78px;
  border:3px solid #1976d2;
  background:white !important;
  color:#1976d2 !important;
  border-radius:12px;
  font-size:30px;
  font-weight:bold;
}

/* 만족도 조사 카드 */
.survey-card {
  display:none;
  width:90%;
  max-width:850px;
  margin:35px auto 0;
  background:white;
  border-radius:18px;
  padding:38px;
  box-shadow:0 4px 18px rgba(0,0,0,0.12);
  text-align:left;
}

.survey-title {
  font-size:32px;
  font-weight:bold;
}

.dashed {
  border-top:2px dashed #ddd;
  margin:25px 0 35px;
}

.q-row {
  display:flex;
  gap:18px;
  align-items:flex-start;
  margin-bottom:20px;
}

.q-num {
  min-width:42px;
  height:42px;
  background:#1976d2;
  color:white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:bold;
}

.q-text {
  font-size:25px;
  font-weight:bold;
  line-height:1.5;
}

.scale-label {
  display:flex;
  justify-content:space-between;
  font-size:19px;
  color:#555;
  margin:25px 35px 5px;
}

.scale-wrap {
  position:relative;
  display:flex;
  justify-content:space-between;
  margin:0 45px 35px;
  padding-top:30px;
}

.scale-line {
  position:absolute;
  top:42px;
  left:0;
  right:0;
  height:4px;
  background:#999;
  z-index:1;
}

.scale-item {
  position:relative;
  z-index:2;
  text-align:center;
  cursor:pointer;
}

.scale-stick {
  width:4px;
  height:35px;
  background:#999;
  margin:0 auto 8px;
}

.scale-circle {
  width:30px;
  height:30px;
  border:3px solid #777;
  border-radius:50%;
  background:white;
  margin:0 auto 10px;
}

.scale-item.selected .scale-circle {
  background:#1976d2;
  border-color:#1976d2;
}

.scale-num {
  font-size:24px;
  font-weight:bold;
}

.choice-wrap {
  display:flex;
  gap:25px;
  margin-top:25px;
}

.choice {
  flex:1;
  height:70px;
  width:auto;
  padding:0 0 0 28px;
  border:2px solid #ddd;
  border-radius:10px;
  background:white !important;
  color:#222 !important;
  font-size:24px;
  text-align:left;
}

.choice::before {
  content:"○";
  font-size:30px;
  margin-right:22px;
  color:#aaa;
}

.choice.selected {
  border-color:#1976d2;
  color:#1976d2 !important;
  font-weight:bold;
}

.choice.selected::before {
  content:"●";
  color:#1976d2;
}

.submit-btn {
  display:block;
  width:360px;
  height:78px;
  margin:35px auto 10px;
  background:#1976d2 !important;
  color:white !important;
  border-radius:12px;
  font-size:32px;
  font-weight:bold;
}

.notice {
  text-align:center;
  color:#666;
  font-size:18px;
  margin-top:20px;
}
body {
  margin:0;
  font-family: sans-serif;
  text-align:center;
  background:#f5f5f5;
}

/* ⭐ 원래 위치로 복구 */
#main {
  padding-top:100px;
}

h1 {
  font-size:75px;
  margin-bottom:40px;
}

/* 버튼 가로 정렬 */
.button-wrap {
  display:flex;
  justify-content:center;
  gap:45px;
  margin-top:30px;
}

button {
  width:350px;
  padding:37px;
  font-size:35px;
  border:none;
  border-radius:15px;
  color:white;
  cursor:pointer;
}

/* 버튼 색상 구분 */
button:nth-child(1) {
  background:#2e7d32; /* 초록 */
}

button:nth-child(2) {
  background:#1976d2; /* 파랑 */
}

/* 이미지 화면 */
#viewer {
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:white;
}

#viewer img {
  width:95%;
  margin-top:80px;
}

.close {
  position:absolute;
  top:20px;
  right:30px;
  font-size:45px;
  cursor:pointer;
}
</style>

</head>
<body>

<div id="main">
  <h1>운전면허증 종류 안내</h1>
  <p style="font-size:30px; color:#555; margin-top:0; margin-bottom:75px;">
    기본(국문) 운전면허증에 추가 가능
  </p>
  <p style="font-size:30px;">확인하실 운전면허증을 선택해주세요.</p>

  <div class="button-wrap">
    <button onclick="show('eng')">영문 운전면허증</button>
    <button onclick="show('mobile')">모바일 운전면허증</button>
</div>
<div class="survey-guide">더 나은 안내를 위해 의견을 들려주세요!</div>
<div class="arrow">▼</div>

<button class="survey-open" onclick="toggleSurvey()">📋 만족도 조사</button>

<div id="surveyCard" class="survey-card">
  <div class="survey-title">📋 만족도 조사</div>
  <div class="dashed"></div>

  <div class="q-row">
    <div class="q-num">1</div>
    <div class="q-text">
      안내페이지가 영문·모바일 운전면허증 종류를 이해하고<br>
      선택하는 데 도움이 되었습니까?
    </div>
  </div>

  <div class="scale-label">
    <span>전혀 도움되지 않음</span>
    <span>매우 도움 됨</span>
  </div>

  <div class="scale-wrap">
    <div class="scale-line"></div>

    <div class="scale-item" onclick="selectScore(1)">
      <div class="scale-stick"></div><div class="scale-circle"></div><div class="scale-num">1</div>
    </div>
    <div class="scale-item" onclick="selectScore(2)">
      <div class="scale-stick"></div><div class="scale-circle"></div><div class="scale-num">2</div>
    </div>
    <div class="scale-item" onclick="selectScore(3)">
      <div class="scale-stick"></div><div class="scale-circle"></div><div class="scale-num">3</div>
    </div>
    <div class="scale-item" onclick="selectScore(4)">
      <div class="scale-stick"></div><div class="scale-circle"></div><div class="scale-num">4</div>
    </div>
    <div class="scale-item" onclick="selectScore(5)">
      <div class="scale-stick"></div><div class="scale-circle"></div><div class="scale-num">5</div>
    </div>
  </div>

  <div class="q-row">
    <div class="q-num">2</div>
    <div class="q-text">
      안내 페이지를 확인한 후,<br>
      본인이 발급받을 운전면허증 종류를 미리 결정하셨습니까?
    </div>
  </div>

  <div class="choice-wrap">
    <button class="choice" onclick="selectDecision('예', this)">예</button>
    <button class="choice" onclick="selectDecision('아니오', this)">아니오</button>
  </div>

  <div class="dashed"></div>

  <button class="submit-btn" onclick="submitSurvey()">제출하기</button>

  <div class="notice">🔒 제출된 내용은 통계 분석을 위해서만 사용됩니다.</div>
</div>
</div>

<!-- ⭐ 전체 클릭 시 뒤로가기 -->
<div id="viewer" onclick="back()">
  <div class="close" onclick="back(); event.stopPropagation();">✖</div>
  <img id="img">
</div>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyOQFc9Ko8kMDkulJSe0UksK_J8ewhdPw5LrZWHYwTLTAXtPKsrQFEXDTc8Gfc6WpURhQ/exec";

let selectedScore = "";
let selectedDecision = "";

function toggleSurvey(){
  const card = document.getElementById('surveyCard');

  if(card.style.display === 'block'){
    card.style.display = 'none';
  } else {
    card.style.display = 'block';
    card.scrollIntoView({ behavior:'smooth', block:'start' });
  }
}

function selectScore(score){
  selectedScore = score;

  const items = document.querySelectorAll('.scale-item');
  items.forEach(item => item.classList.remove('selected'));

  items[score - 1].classList.add('selected');
}

function selectDecision(value, btn){
  selectedDecision = value;

  const buttons = document.querySelectorAll('.choice');
  buttons.forEach(b => b.classList.remove('selected'));

  btn.classList.add('selected');
}

function submitSurvey(){
  if(!selectedScore || !selectedDecision){
    alert("모든 문항을 선택해주세요.");
    return;
  }

  const data = {
    score: selectedScore,
    decision: selectedDecision,
    page: "운전면허증 종류 안내",
    time: new Date().toLocaleString()
  };

  fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify(data)
  });

  alert("소중한 의견 감사합니다!");

  selectedScore = "";
  selectedDecision = "";

  document.querySelectorAll('.scale-item').forEach(item => item.classList.remove('selected'));
  document.querySelectorAll('.choice').forEach(btn => btn.classList.remove('selected'));
  document.getElementById('surveyCard').style.display = 'none';
}

function show(type){
  document.getElementById('main').style.display='none';
  document.getElementById('viewer').style.display='block';

  if(type==='eng'){
    document.getElementById('img').src = engImg;
  } else {
    document.getElementById('img').src = mobileImg;
  }
}

function back(){
  document.getElementById('viewer').style.display='none';
  document.getElementById('main').style.display='block';
}
</script>
